<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD Batch OCR & PDF Overlay - OpenRouter</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- pdf-lib CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.9/pdf-lib.min.js"></script>
  <!-- JSZip CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1329; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-4 py-2.5">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-purple-600/30">
          CAD
        </div>
        <div>
          <h1 class="text-sm font-bold text-white flex items-center gap-2">
            CAD Batch OCR &amp; PDF Overlay
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800 font-mono">
              v2.0 Fixed 405
            </span>
          </h1>
          <p class="text-[11px] text-slate-400">
            OpenRouter Direct Web API • Hỗ trợ bóc tách bản vẽ kỹ thuật &amp; khung tên
          </p>
        </div>
      </div>

      <!-- API KEY INPUT -->
      <div class="flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-xl border border-slate-800 shadow-inner">
        <span class="text-[11px] font-semibold text-purple-400 pl-1 shrink-0">OpenRouter Key:</span>
        <div class="relative">
          <input
            id="apiKeyInput"
            type="password"
            placeholder="Dán key sk-or-v1-..."
            class="w-52 sm:w-64 px-2.5 py-1 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-purple-500 font-mono"
          />
          <button id="toggleKeyBtn" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 hover:text-white">
            Hiện
          </button>
        </div>
        <select id="modelSelect" class="bg-slate-900 text-xs border border-slate-700 text-slate-300 rounded-lg px-2 py-1 focus:outline-none">
          <option value="qwen/qwen-2.5-vl-7b-instruct:free">Qwen 2.5 VL 7B (Free)</option>
          <option value="meta-llama/llama-3.2-11b-vision-instruct:free">Llama 3.2 11B Vision (Free)</option>
          <option value="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash (Free)</option>
        </select>
      </div>
    </div>
  </header>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl bg-slate-900 border border-purple-500 text-xs text-white shadow-2xl transition-all">
    <span id="toastMsg"></span>
  </div>

  <!-- WORKSPACE -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
    <!-- LEFT: QUEUE & UPLOAD (4 cols) -->
    <div class="lg:col-span-4 flex flex-col h-[calc(100vh-6.5rem)] bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-xl">
      <div class="p-3 border-b border-slate-800 bg-slate-950/60">
        <div id="dropZone" class="flex flex-col items-center justify-center p-3 border-2 border-dashed border-slate-700 hover:border-purple-500 rounded-xl bg-slate-900/50 transition-all text-center">
          <span class="text-xs font-semibold text-slate-200 mb-2">Chọn hoặc kéo thả ảnh bản vẽ vào đây</span>
          <input
            id="fileInput"
            type="file"
            multiple
            accept="image/*"
            class="block w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer"
          />
          <span class="text-[10px] text-slate-500 mt-2">Hỗ trợ PNG, JPG, JPEG, WEBP</span>
        </div>
      </div>

      <!-- TOOLBAR -->
      <div class="p-2.5 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between gap-1 flex-wrap">
        <button id="startOcrBtn" class="px-3.5 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold shadow-md transition-all disabled:opacity-50">
          Bắt đầu OCR
        </button>
        <div class="flex items-center gap-1">
          <button id="downloadZipBtn" disabled class="px-2.5 py-1.5 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-white text-xs font-semibold shadow-md disabled:opacity-40" title="Tải trọn bộ 3 file cho tất cả bản vẽ">
            Tải tất cả (.ZIP)
          </button>
          <button id="downloadPdfZipBtn" disabled class="px-2 py-1.5 rounded-lg bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-500/40 text-xs disabled:opacity-40">
            PDF .ZIP
          </button>
        </div>
      </div>

      <!-- QUEUE LIST -->
      <div id="queueList" class="flex-1 overflow-y-auto p-2 space-y-1.5">
        <div class="p-6 text-center text-xs text-slate-500">Chưa có file nào trong hàng đợi</div>
      </div>
    </div>

    <!-- RIGHT: VIEWER & OUTPUT (8 cols) -->
    <div class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-4 h-[calc(100vh-6.5rem)]">
      <!-- VIEWER -->
      <div class="h-full bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-xl">
        <div class="p-2.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between text-xs">
          <span id="activeFileName" class="font-mono text-slate-300 truncate max-w-[150px]">Bản vẽ</span>
          <div class="flex items-center gap-1.5">
            <button id="toggleOverlayBtn" class="px-2 py-0.
