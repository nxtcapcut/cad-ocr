<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD Batch OCR & PDF Overlay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.9/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1329; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-4 py-2.5">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-purple-600/30">
          CAD
        </div>
        <div>
          <h1 class="text-sm font-bold text-white flex items-center gap-2">
            CAD Batch OCR &amp; PDF Overlay
            <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-400 text-slate-950 border border-emerald-300 font-mono font-extrabold">
              v16.0 Clean Path
            </span>
          </h1>
          <p class="text-[11px] text-slate-400">
            Google Gemini REST API • Bóc tách văn bản bản vẽ kỹ thuật &amp; khung tên
          </p>
        </div>
      </div>

      <!-- CẤU HÌNH API KEY & MODEL -->
      <div class="flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-xl border border-slate-800 shadow-inner flex-wrap">
        <span class="text-xs font-semibold text-purple-400 pl-1 shrink-0">Gemini Key:</span>
        <div class="relative">
          <input
            id="apiKeyInput"
            type="password"
            placeholder="Dán mã key AIzaSy..."
            class="w-56 sm:w-64 px-2.5 py-1 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-purple-500 font-mono"
          />
          <button id="toggleKeyBtn" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 hover:text-white">
            Hiện
          </button>
        </div>
        <select id="modelSelect" class="bg-slate-900 text-xs border border-purple-500/50 text-purple-300 font-semibold rounded-lg px-2.5 py-1 focus:outline-none">
          <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        </select>
      </div>
    </div>
  </header>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl bg-slate-900 border border-purple-500 text-xs text-white shadow-2xl transition-all">
    <span id="toastMsg"></span>
  </div>

  <!-- WORKSPACE -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
    <!-- CỘT TRÁI -->
    <div class="lg:col-span-4 flex flex-col h-[calc(100vh-6.5rem)] bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-xl">
      <div class="p-3 border-b border-slate-800 bg-slate-950/60">
        <div id="dropZone" class="p-4 border-2 border-dashed border-purple-500/60 hover:border-purple-400 rounded-xl bg-purple-950/20 hover:bg-purple-950/30 transition-all text-center flex flex-col items-center justify-center">
          <svg class="w-7 h-7 text-purple-400 mb-1 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
          <span class="text-xs font-bold text-purple-200 pointer-events-none mb-2">CHỌN HOẶC KÉO THẢ BẢN VẼ VÀO ĐÂY</span>
          <input
            id="fileInput"
            type="file"
            multiple
            accept="image/*"
            class="block w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer"
          />
        </div>
      </div>

      <!-- TOOLBAR -->
      <div class="p-2.5 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between gap-1 flex-wrap">
        <button id="startOcrBtn" class="px-3.5 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold shadow-md transition-all disabled:opacity-50">
          Bắt đầu OCR
        </button>
        <div class="flex items-center gap-1">
          <button id="downloadZipBtn" disabled class="px-2.5 py-1.5 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-white text-xs font-semibold shadow-md disabled:opacity-40">
            Tải tất cả (.ZIP)
          </button>
          <button id="downloadPdfZipBtn" disabled class="px-2 py-1.5 rounded-lg bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-500/40 text-xs disabled:opacity-40">
            PDF .ZIP
          </button>
        </div>
      </div>

      <!-- QUEUE LIST -->
      <div id="queueList" class="flex-1 overflow-y-auto p-2 space-y-1.5">
        <div id="emptyHint" class="p-8 text-center text-xs text-slate-500 flex flex-col items-center justify-center gap-2">
          Chưa có file nào trong hàng đợi
        </div>
      </div>
    </div>

    <!-- CỘT PHẢI -->
    <div class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-4 h-[calc(100vh-6.5rem)]">
      <!-- VIEWER -->
      <div class="h-full bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-xl">
        <div class="p-2.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between text-xs">
          <span id="activeFileName" class="font-mono text-slate-300 truncate max-w-[150px]">Bản vẽ</span>
          <div class="flex items-center gap-1.5">
            <button id="toggleOverlayBtn" class="px-2 py-0.5 rounded text-[11px] border bg-purple-600 text-white border-purple-500">
              Chữ đè (PDF)
            </button>
            <input id="textColorInput" type="color" value="#7c3aed" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent" title="Màu chữ đè" />
          </div>
        </div>

        <div class="flex-1 relative overflow-auto p-4 flex items-center justify-center bg-[#070e1b]">
          <div id="imageWrapper" class="relative inline-block max-w-full">
            <span class="text-xs text-slate-600">Chọn ảnh để xem</span>
          </div>
        </div>
      </div>

      <!-- TEXT OUTPUT -->
      <div class="h-full bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-xl">
        <div class="p-2 bg-slate-950 border-b border-slate-800 flex items-center justify-between flex-wrap gap-2">
          <div class="flex items-center gap-1">
            <button id="tabFormattedBtn" class="px-2 py-1 rounded text-xs bg-purple-600 text-white font-semibold">
              Text 1 cột
            </button>
            <button id="tabTitleBlockBtn" class="px-2 py-1 rounded text-xs text-amber-400/80">
              Khung tên
            </button>
          </div>

          <div id="actionExportGroup" class="hidden items-center gap-1">
            <button id="downloadTxtBtn" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium">
              .TXT
            </button>
            <button id="downloadTbTxtBtn" class="px-2 py-1 rounded bg-amber-950/80 hover:bg-amber-900 text-amber-300 border border-amber-600/50 text-xs font-medium">
              Khung tên .TXT
            </button>
            <button id="downloadSinglePdfBtn" class="px-2.5 py-1 rounded bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold shadow">
              Tải PDF
            </button>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto p-3 font-mono text-xs">
          <pre id="textDisplayBox" class="p-3 bg-slate-950 rounded-lg text-slate-200 whitespace-pre-wrap leading-relaxed h-full overflow-auto">
(Chưa có kết quả OCR)
          </pre>
        </div>
      </div>
    </div>
  </main>

  <script>
    let state = {
      apiKey: localStorage.getItem("cad_gemini_key_clean") || "",
      queue: [],
      activeItemId: null,
      isProcessing: false,
      overlayMode: true,
      textColor: "#7c3aed",
      currentTab: "formatted"
    };

    const apiKeyInput = document.getElementById("apiKeyInput");
    const toggleKeyBtn = document.getElementById("toggleKeyBtn");
    const modelSelect = document.getElementById("modelSelect");
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const queueList = document.getElementById("queueList");
    const emptyHint = document.getElementById("emptyHint");
    const startOcrBtn = document.getElementById("startOcrBtn");
    const downloadZipBtn = document.getElementById("downloadZipBtn");
    const downloadPdfZipBtn = document.getElementById("downloadPdfZipBtn");
    const activeFileName = document.getElementById("activeFileName");
    const toggleOverlayBtn = document.getElementById("toggleOverlayBtn");
    const textColorInput = document.getElementById("textColorInput");
    const imageWrapper = document.getElementById("imageWrapper");
    const tabFormattedBtn = document.getElementById("tabFormattedBtn");
    const tabTitleBlockBtn = document.getElementById("tabTitleBlockBtn");
    const textDisplayBox = document.getElementById("textDisplayBox");
    const actionExportGroup = document.getElementById("actionExportGroup");
    const downloadTxtBtn = document.getElementById("downloadTxtBtn");
    const downloadTbTxtBtn = document.getElementById("downloadTbTxtBtn");
    const downloadSinglePdfBtn = document.getElementById("downloadSinglePdfBtn");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toastMsg");

    apiKeyInput.value = state.apiKey;
    apiKeyInput.addEventListener("input", (e) => {
      state.apiKey = e.target.value.trim();
      localStorage.setItem("cad_gemini_key_clean", state.apiKey);
    });

    toggleKeyBtn.addEventListener("click", () => {
      if (apiKeyInput.type === "password") {
        apiKeyInput.type = "text";
        toggleKeyBtn.textContent = "Ẩn";
      } else {
        apiKeyInput.type = "password";
        toggleKeyBtn.textContent = "Hiện";
      }
    });

    function showToast(msg, isError = false) {
      toastMsg.textContent = msg;
      toast.className = `fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl bg-slate-900 border ${isError ? 'border-red-500 text-red-200' : 'border-purple-500 text-white'} text-xs shadow-2xl`;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 3500);
    }

    function handleFiles(files) {
      if (!files || !files.length) return;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const item = {
            id: "f_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
            name: file.name,
            previewUrl: e.target.result,
            status: "idle",
            result: null
          };
          state.queue.push(item);
          if (!state.activeItemId) state.activeItemId = item.id;
          renderQueue();
          renderActiveView();
        };
        reader.readAsDataURL(file);
      });
      showToast("Đã thêm bản vẽ vào hàng đợi!");
    }

    fileInput.addEventListener("change", (e) => {
